baseURL = "https://letsgetai.github.io/"
languageCode = "zh-cn"
title = "Lets Get AI"
theme = "PaperMod"

enableRobotsTXT = true
enableEmoji = true

[params]
  description = "Notes on LLMs, agents, RL and AI infrastructure"
  author = "胡权"
  DateFormat = "2006-01-02"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true

  [params.homeInfoParams]
    Title = "Lets Get AI"
    Content = "Algorithm engineer writing about large language models, AI agents, reinforcement learning, and AI infrastructure. Research notes and experiment write-ups."

  [params.assets]
    disableHLJS = true

  [params.fuseOpts]
    isCaseSensitive = false

[[menu.main]]
    name = "首页"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "归档"
    url = "/archives/"
    weight = 2
  [[menu.main]]
    name = "关于"
    url = "/about/"
    weight = 3

[outputs]
  home = ["HTML", "RSS", "JSON"]
