baseURL = "https://letsgetai.github.io/"
languageCode = "zh-cn"
title = "The Herta"
theme = "PaperMod"

enableRobotsTXT = true
enableEmoji = true

[params]
  description = "Notes on LLMs, agents, RL and AI infrastructure"
  author = "LetsGetAI"
  DateFormat = "2006-01-02"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
[params.assets]
    disableHLJS = true

  [params.fuseOpts]
    isCaseSensitive = false

[[menu.main]]
    name = "首页"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "归档"
    url = "/archives/"
    weight = 2
  [[menu.main]]
    name = "关于"
    url = "/about/"
    weight = 3
  [[menu.main]]
    name = "分类"
    url = "/categories/"
    weight = 4
  [[menu.main]]
    name = "GitHub"
    url = "https://github.com/letsgetai"
    weight = 5

[outputs]
  home = ["HTML", "RSS", "JSON"]


[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [['\[', '\]'], ['$$', '$$']]
    inline = [['\(', '\)'], ['$', '$']]
